# Public e-book page at kmgtools.us/ebooks/content-playbook
# Install as /etc/nginx/conf.d/ebooks.conf (conf.d is included at http level,
# which limit_req_zone requires).
#
# Rate limit: 10 requests/minute per visitor, burst of 10 so a normal human
# flow (page, submit, redirect, download = ~4 requests) never trips it.
# Over the limit gets HTTP 429.
#
# Visitor identity (anti-spoofing): the visitor's real IP is taken from the
# CF-Connecting-IP header ONLY when the connection genuinely comes from a
# Cloudflare address (the set_real_ip_from list below). A request that hits
# the server directly and sends a fake CF-Connecting-IP header is ignored,
# so rotating that header does not evade the limit.
#
# MAINTENANCE: Cloudflare's ranges change rarely (a few times a decade), but
# when they do, this list must be refreshed from:
#   https://www.cloudflare.com/ips-v4   and   https://www.cloudflare.com/ips-v6
# List last synced: 2026-10-06.

limit_req_zone $binary_remote_addr zone=ebook:10m rate=10r/m;

server {
    listen 80;
    server_name kmgtools.us;

    # Trust CF-Connecting-IP only from these Cloudflare ranges.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 10k;

    # Only the e-book routes are forwarded to Studio. Everything else on the
    # bare domain is a 404, so Studio's login and tools aren't exposed here.
    location /ebooks/content-playbook {
        limit_req zone=ebook burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # The PDF itself. "internal" = unreachable by direct URL; only Flask's
    # X-Accel-Redirect (after the email gate passes) can trigger it.
    location /_ebook_file/ {
        internal;
        alias /var/www/studio/private/;
    }

    location / {
        return 404;
    }
}
